name: Keep Alive

# Ping the Render backend every 14 minutes to prevent free-tier sleep.
# Render free web services spin down after 15 min of inactivity.

on:
  schedule:
    # Every 14 minutes, 24/7
    - cron: '*/14 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping backend health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_BACKEND_URL || 'https://codesentinel-backend.onrender.com' }}/api/health/?deep=false
        run: |
          echo "Pinging: $HEALTH_URL"
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$HEALTH_URL" || true)
          echo "Response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Backend is alive"
          else
            echo "⚠️ Backend returned $response (may be waking up from cold start)"
          fi
