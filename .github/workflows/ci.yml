name: CodeSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-test-secret-key
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  FIREBASE_PROJECT_ID: ci-test-project
  FIREBASE_RTDB_URL: https://ci-test-default-rtdb.firebaseio.com/
  FIREBASE_ADMIN_SDK_JSON_PATH: ""
  NVIDIA_API_KEY: ci-dummy-key
  GEMINI_API_KEY: ci-dummy-key
  GROQ_API_KEY: ci-dummy-key
  FIELD_ENCRYPTION_KEY: ""
  REDIS_URL: redis://localhost:6379/0
  GITHUB_CLIENT_ID: ci-dummy
  GITHUB_CLIENT_SECRET: ci-dummy

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Django system check
        run: |
          cd backend
          python manage.py check --deploy 2>&1 || python manage.py check
      - name: Run tests
        run: |
          cd backend
          python manage.py test --verbosity=2

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker images
        run: docker compose build
